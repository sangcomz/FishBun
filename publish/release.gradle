apply plugin: "maven-publish"
apply plugin: "signing"

group = "io.github.sangcomz"
version = gradle.versionName
archivesBaseName = "fishbun"

def siteUrl = 'https://github.com/sangcomz/FishBun'      // Homepage URL of the library
def gitUrl = 'https://github.com/sangcomz/FishBun.git'   // Git repository URL

afterEvaluate {

    // Use existing sourceJar task if available (created by other plugins)
    // Otherwise create a new one
    def sourceJarTask = tasks.findByName('releaseSourcesJar') ?: tasks.create('sourceJar', Jar) {
        from android.sourceSets.main.java.srcDirs
        archiveClassifier.set("sources")
    }

    task javadoc(type: Javadoc) {
        source = android.sourceSets.main.java.srcDirs
        classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
    }

    task javadocJar(type: Jar, dependsOn: javadoc) {
        archiveClassifier.set("javadoc")
        from javadoc.destinationDir
    }

    // https://docs.gradle.org/current/userguide/publishing_maven.html
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                groupId group
                artifactId archivesBaseName
                version version

                // Manually add artifacts to avoid conflicts
                artifact tasks.named('bundleReleaseAar').flatMap { it.archiveFile }
                artifact sourceJarTask
                artifact javadocJar

                pom {
                    name = archivesBaseName
                    description = 'FishBun is a highly customizable image picker for Android.'
                    url = siteUrl
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'sangcomz'
                            name = 'Seokwon Jeong'
                            email = 'dev.seokwon2@gmail.com'
                        }
                    }
                    scm {
                        url = gitUrl
                    }
                }
            }
        }

        repositories {
            maven {
                if (version.endsWith("-SNAPSHOT")) {
                    url = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
                } else {
                    url = "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
                }
            }
        }
    }

    signing {
        def signingKeyId = findProperty("signingKeyId") ?: System.getenv("SIGNING_KEY_ID")
        def signingPassword = findProperty("signingPassword") ?: System.getenv("SIGNING_PASSWORD")
        def skipSigning = findProperty("skipSigning") ?: System.getenv("SKIP_SIGNING")

        // Only sign if all signing credentials are provided and skipSigning is not set
        required { signingKeyId && signingPassword && !skipSigning }

        if (signingKeyId && signingPassword && !skipSigning) {
            // Use GPG agent instead of in-memory keys
            useGpgCmd()
            sign publishing.publications.release
        }
    }

    javadoc {
        if (JavaVersion.current().isJava9Compatible()) {
            options.addBooleanOption('html5', true)
        }
    }

    // Add explicit task dependencies to fix Gradle 8.x warnings
    tasks.withType(GenerateModuleMetadata) {
        dependsOn(sourceJarTask, javadocJar)
    }
}

githubRelease {
    owner = 'sangcomz'
    repo = 'Fishbun'
    token = githubAccessTokens
    tagName = version
    targetCommitish = 'master'
    body = """## Release Note
* fix issue #234 #254 
"""
    name = version
}